# Development database. `docker compose up -d`, then use the DATABASE_URL from .env.example.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: bugsink
      POSTGRES_DB: bugsink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
