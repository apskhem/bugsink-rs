[workspace]
resolver = "3"
members = ["bugsink-*"]

[workspace.package]
# MAJOR.MINOR: the upstream Bugsink line (2.6.x, schema 2.6.3); patch: our own fixes. Keep package.json and
# frontend/package.json in step.
version = "2.6.1"
edition = "2024"
# sqlx 0.9 needs 1.94
rust-version = "1.94"
authors = ["Apisit Ritruengroj <apisit_lon@hotmail.com>"]
repository = "https://github.com/apskhem/bugsink-rs"
homepage = "https://github.com/apskhem/bugsink-rs"
readme = "README.md"
license = "PolyForm-Shield-1.0.0"
publish = false

[workspace.dependencies]
# internal
bugsink-db = { path = "bugsink-db" }

# external
anyhow = "1"
axum = "0.8"
base64 = "0.22"
brotli = "8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
fancy-regex = "0.14"
flate2 = "1"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
mimalloc = "0.1"
rand = "0.9"
regex = "1"
regex-syntax = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "json", "chrono", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Password hashing is Django's PBKDF2 with 1,000,000 iterations: unoptimized, a login takes seconds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

# The shipped binary: whole-program optimization, at the cost of a slower build.
# Panics keep unwinding: axum and tokio contain a handler's panic to its request.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
