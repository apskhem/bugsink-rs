<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bugsink</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/ibm-plex-sans-v19-cyrillic_cyrillic-ext_greek_latin_latin-ext_vietnamese-regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Upstream's theme switching: `data-theme` is the user's preference; "system" follows the OS.
      (function () {
        var html = document.documentElement;
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var preference = html.getAttribute("data-theme-preference") || "system";
          html.setAttribute("data-theme", preference === "system" ? (media.matches ? "dark" : "light") : preference);
        }
        apply();
        media.addEventListener("change", apply);
        window.__applyTheme = apply;
      })();
    </script>
  </head>
  <body class="dark:bg-slate-700 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
